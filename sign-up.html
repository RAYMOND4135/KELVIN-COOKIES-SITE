<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sign-up-style.css">
</head>
<body>
    <section>
        <div class="sign-up-div">
            <div class="form-group1">
                <label for="NAME">Name</label><br>
                <input type="text" name="" id="NAME" placeholder="Enter your Full Name">
            </div>
            <div class="form-group2">
                <label for="EMAIL">Email</label><br>
                <input type="text" name="" id="EMAIL" placeholder="Enter a valid email address">
            </div>
            <div class="form-group3">
                <label for="password">Password</label><br>
                <input type="text" name="" id="password" placeholder="At least 8 characters" required>
            </div>
            <div class="form-group4">
                <input type="checkbox" name="" id="checkbox">
                <label for="checkbox">I accept the <a href="#">Terms of Service</a>
                </label>
            </div>
            <button class="">
                <a href="#">SIGN UP</a>
            </button>
     
        </div>
    </section>
</body>
</html>
